<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gift Settings</title>
  <style>
    :root{--bg:#17392f;--bg2:#274d41;--card:rgba(255,255,255,.08);--line:rgba(255,250,240,.22);--text:#fffaf0;--muted:rgba(255,250,240,.72);--paper:#fff8eb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.11),transparent 28%),radial-gradient(circle at 92% 78%,rgba(245,190,140,.15),transparent 24%),linear-gradient(145deg,var(--bg),var(--bg2));padding:20px 12px}
    .wrap{width:min(860px,100%);margin:0 auto}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:26px;font-weight:800}.logo{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line)}.badge{border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--muted);font-size:13px;font-weight:800}
    .card{border:1px solid var(--line);border-radius:34px;background:var(--card);backdrop-filter:blur(16px);box-shadow:0 28px 90px rgba(0,0,0,.24);padding:26px}
    h1{font-family:Georgia,serif;font-size:clamp(38px,7vw,66px);line-height:.95;margin:0 0 10px;letter-spacing:-1px}.sub{margin:0 0 18px;color:var(--muted);line-height:1.65}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    label{display:block;margin:15px 0 7px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-size:12px;font-weight:850}
    input,textarea{width:100%;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.08);color:var(--text);padding:14px 15px;outline:0;font-size:16px;font-family:inherit}
    input::placeholder,textarea::placeholder{color:rgba(255,250,240,.42)} textarea{min-height:118px;resize:vertical;line-height:1.55}
    .actions{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:18px}
    button,a{border:1px solid var(--line);border-radius:999px;padding:14px 16px;font-weight:900;text-align:center;text-decoration:none;font-family:inherit;cursor:pointer}.main{background:var(--paper);color:#142f25}.ghost{background:rgba(255,255,255,.08);color:var(--text)}
    .linkbox{display:none;margin-top:14px;padding:14px;border:1px dashed rgba(255,250,240,.36);border-radius:18px;color:var(--muted);overflow-wrap:anywhere;font-size:13px;line-height:1.5}.help{margin-top:12px;color:var(--muted);font-size:14px;line-height:1.55}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(90px);background:var(--paper);color:#142f25;border-radius:999px;padding:12px 16px;font-weight:900;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0)}
    @media(max-width:720px){.grid,.actions{grid-template-columns:1fr}.badge{display:none}.card{padding:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="nav"><div class="brand"><div class="logo">✿</div>Gift Settings</div><div class="badge">Tạo link source</div></div>
    <section class="card">
      <h1>Set up your gift page</h1>
      <p class="sub">Trang này dùng để tạo link cho <b>source.html</b>. Bạn có thể đổi dòng chữ ở phần trái tim hoa và dòng chữ nhỏ bên dưới.</p>
      <div class="grid">
        <div><label for="heartText">Chữ chính ở phần hoa</label><input id="heartText" placeholder="Ví dụ: I love you"></div>
        <div><label for="subText">Chữ nhỏ bên dưới</label><input id="subText" placeholder="Ví dụ: from Kvan"></div>
      </div>
      <label for="note">Ghi chú riêng (tuỳ chọn)</label>
      <textarea id="note" placeholder="Nếu muốn, bạn có thể ghi chú ngắn ở đây. Hiện tại phần này chỉ để bạn lưu vào link, chưa hiển thị trên source."></textarea>
      <div class="actions">
        <button class="main" id="makeLink">Tạo link sang source</button>
        <button class="ghost" id="copyLink">Copy link</button>
        <a class="ghost" href="source.html" target="_blank">Mở source trắng</a>
        <button class="ghost" id="reset">Làm lại</button>
      </div>
      <div class="linkbox" id="linkBox"></div>
      <p class="help">Upload lại cả <b>index.html</b> và <b>source.html</b> lên GitHub. Link gửi sẽ có dạng <b>.../source.html?gift=...</b></p>
    </section>
  </main>
  <div class="toast" id="toast">Đã copy link</div>
  <script>
    const $=id=>document.getElementById(id); let lastLink='';
    function val(id){return $(id).value.trim()}
    function encodeGift(){ return btoa(unescape(encodeURIComponent(JSON.stringify({ht:val('heartText'), st:val('subText'), n:val('note')})))) }
    function sourceBase(){ const path=location.pathname.replace(/index\.html$/,'').replace(/\/$/,'/'); return location.origin+path+'source.html'; }
    function toast(t){ $('toast').textContent=t; $('toast').classList.add('show'); setTimeout(()=> $('toast').classList.remove('show'),1700); }
    function makeLink(){ lastLink = sourceBase()+'?gift='+encodeGift(); $('linkBox').style.display='block'; $('linkBox').textContent=lastLink; navigator.clipboard&&navigator.clipboard.writeText(lastLink); toast('Đã tạo link source'); }
    $('makeLink').onclick=makeLink; $('copyLink').onclick=()=>{ if(!lastLink) makeLink(); navigator.clipboard&&navigator.clipboard.writeText(lastLink); toast('Đã copy link');}; $('reset').onclick=()=>{ ['heartText','subText','note'].forEach(id=>$(id).value=''); lastLink=''; $('linkBox').style.display='none'; }
  </script>
</body>
</html>
